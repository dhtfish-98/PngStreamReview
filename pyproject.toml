[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pngstreamreview"
version = "1.0.2"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: PngStreamReview"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
pngstreamreview = "pngstreamreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
